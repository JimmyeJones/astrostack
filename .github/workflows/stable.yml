name: Release to stable

# `stable` is what the owner deploys (the Settings → Update button and
# scripts/deploy.sh with no argument). Since the 1.0 plan (docs/ROADMAP-1.0.md)
# it moves only when a milestone is declared ready: someone runs this workflow
# by hand, naming the commit on main to release (default: main's newest). It
# still only ever moves forward, and only to a commit on main's merge line
# whose own CI run on main passed.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit (or tag) on main to release; blank = main's newest"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: advance-stable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move stable to the chosen green commit
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.ref }}
        run: |
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          pick=$(git rev-parse --verify "${WANT:-origin/main}^{commit}")
          if ! git merge-base --is-ancestor "$pick" origin/main; then
            echo "::error::$pick is not on main."; exit 1
          fi
          if ! git rev-list --first-parent origin/main | grep -qx "$pick"; then
            echo "::error::$pick is not on main's merge line (pick a merge commit)."; exit 1
          fi
          concl=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$pick&event=push&per_page=5" \
                    --jq '[.workflow_runs[] | select(.status=="completed") | .conclusion] | first // ""')
          if [ "$concl" != success ]; then
            echo "::error::CI on main for $pick is '${concl:-not finished}', not success."; exit 1
          fi
          current=$(git rev-parse -q --verify origin/stable || true)
          if [ -n "$current" ] && ! git merge-base --is-ancestor "$current" "$pick"; then
            echo "::error::stable ($current) is not an ancestor of $pick — refusing to move it backwards or sideways."; exit 1
          fi
          git push origin "$pick:refs/heads/stable"
          echo "stable → $(git log -1 --format='%h %s' "$pick" | cut -c1-100)"
