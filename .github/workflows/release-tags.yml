name: Release tags

# One git tag per released version (`v0.479.2` → the merge that shipped it), so a
# deploy or a rollback can name an exact build (`git checkout v0.455.7`), and a
# version number can never be used twice without the run going red.
#
# The logic is scripts/release-tags.sh (tests/test_version_bump_check.py runs it
# against scratch repositories); this file only decides when it runs:
#
# - push to main: tag every version transition on main's first-parent line since
#   the last tag — not just this push's tip — so a run that never happened (a
#   cancelled queue, a lost delivery) is made up for by the next one, in
#   whatever order the runs land, and re-running is a no-op. A push that changed
#   code but not the version, or moved it backwards, goes RED and tags nothing:
#   two changes under one number (v0.448.0, v0.453.3, and the audit's B-F2 pair
#   at 0.492.5) used to be skipped silently as "unchanged".
# - workflow_dispatch "backfill": the same walk to the root. Safe to re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Tag every past version on main (first use of each number)"
        type: boolean
        default: true

permissions:
  contents: write

# Every push to main gets its run, in order: `queue: max` keeps up to 100 pending
# runs in the group instead of the default one, where a third push cancelled the
# second's (audit 2026-09-30, B-F5). The walk above makes even a lost run harmless.
concurrency:
  group: release-tags
  cancel-in-progress: false
  queue: max

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag every version this push (or any lost run before it) shipped
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/release-tags.sh --push "$BEFORE"
      - name: Backfill every past version
        if: github.event_name == 'workflow_dispatch' && inputs.backfill
        run: scripts/release-tags.sh --push --backfill
